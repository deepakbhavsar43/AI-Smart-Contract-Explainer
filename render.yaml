# One-click deploy on Render (https://render.com): New > Blueprint > point at this repo.
services:
  - type: web
    name: ai-smart-contract-explainer
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ETHERSCAN_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: auto
      - key: RATE_LIMIT_PER_HOUR
        value: "30"
      - key: LLM_MAX_FUNCTIONS
        value: "15"
